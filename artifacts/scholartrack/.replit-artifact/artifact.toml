kind = "web"
previewPath = "/"
title = "ScholarTrack"
version = "1.0.0"
id = "artifacts/scholartrack"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18248

[services.development]
run = "pnpm --filter @workspace/scholartrack run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scholartrack", "run", "build" ]
publicDir = "artifacts/scholartrack/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18248"
BASE_PATH = "/"
